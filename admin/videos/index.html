<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Видео — Админ-панель</title>
<link rel="icon" href="../../file/main.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap active">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="../../file/main.png" alt="Метро New"><div class="sidebar-brand-text">Метро New<em>Админ-панель</em></div></div>
    <nav class="sidebar-nav">
      <a class="sidebar-item" href="../news/">Создать</a>
      <a class="sidebar-item" href="../published/">Опубликованные</a>
      <a class="sidebar-item" href="../calendar/">Календарь</a>
      <a class="sidebar-item" href="../media/">Медиа</a>
      <a class="sidebar-item active" href="../videos/">Видео</a>
      <a class="sidebar-item" href="../analytics/">Аналитика</a>
      <a class="sidebar-item" href="../trash/">Корзина</a>
      <button class="sidebar-item" onclick="open2FASettings()">2FA</button>
    </nav>
    <div class="sidebar-footer">
      <a class="sidebar-item" href="../../">На сайт</a>
      <button class="sidebar-item sidebar-logout" onclick="logout()">Выйти</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><h1>Видео</h1></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div id="adminContent"></div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="twofaModal">
  <div class="modal-preview" style="max-width:480px;">
    <button class="modal-preview-close" onclick="document.getElementById('twofaModal').classList.remove('open')">✕</button>
    <div class="preview-content" id="twofaContent"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="../auth.js"></script>
<script>
const YT_ID=/^[A-Za-z0-9_\-]{11}$/;
const isValidYT=id=>YT_ID.test(id);
let allVideosCache=[],editingVideoId=null;
let pendingVideoCoverBlob=null,pendingVideoCoverUrl=null;
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

(async()=>{
  const session=await requireAuth();
  if(!session)return;
  loadVideosTab();
})();

function loadVideosTab(){
  document.getElementById('adminContent').innerHTML=`
    <div class="form-card">
      <div class="form-card-header"><h3 id="videoFormTitle">${editingVideoId?'✏️ Редактировать видео':'+ Добавить видео'}</h3></div>
      <form onsubmit="submitVideo(event)" id="videoFormEl">
        <div class="form-row">
          <div class="form-group"><label>Тип</label><select id="vType"><option value="live">LIVE</option><option value="report">Репортаж</option><option value="vertical">Вертикаль</option></select></div>
          <div class="form-group"><label>Длительность</label><input id="vDur" placeholder="12:34 / LIVE"></div>
        </div>
        <div class="form-group"><label>YouTube ID</label><input id="vId" placeholder="dQw4w9WgXcQ" required pattern="[A-Za-z0-9_\\-]{11}"></div>
        <div class="yt-preview" id="ytPreview"><img src="" alt=""></div>
        <div class="form-group">
          <label>Своя обложка (необязательно)</label>
          <div class="image-upload">
            <label class="upload-btn" for="vCover">Загрузить</label>
            <input type="file" id="vCover" accept="image/*" onchange="previewVideoCover(this)">
            <div class="video-cover-preview" id="vCoverPreview">Нет</div>
            <button type="button" class="toolbar-btn" onclick="clearVideoCover()" id="vCoverClearBtn" style="display:none;">✕ Убрать</button>
          </div>
          <p class="md-help">Если не загрузить — возьмётся превью с YouTube</p>
        </div>
        <div class="form-group"><label>Заголовок</label><input id="vTitle" required></div>
        <div class="form-group"><label>Описание</label><input id="vShort"></div>
        <div class="checkbox-row"><label class="checkbox-label"><input type="checkbox" id="vLive"> Прямой эфир</label><label class="checkbox-label"><input type="checkbox" id="vDraft"> Черновик</label></div>
        <div class="form-actions">
          <button type="submit" class="submit-btn primary" style="max-width:200px;">${editingVideoId?'Сохранить':'Добавить'}</button>
          ${editingVideoId?`<button type="button" class="submit-btn secondary" style="max-width:200px;" onclick="cancelVideoEdit()">Отмена</button>`:''}
        </div>
      </form>
    </div>
    <div class="list-header"><h3>Все видео <span class="list-count" id="videosCount"></span></h3><span class="md-help">Тащи за ⠿ для изменения порядка</span></div>
    <div class="admin-list" id="adminList"><div class="empty"><p>Загрузка...</p></div></div>`;
  loadVideos();
  const vId=document.getElementById('vId');
  vId.addEventListener('input',()=>{const preview=document.getElementById('ytPreview');const val=vId.value.trim();if(/^[A-Za-z0-9_\-]{11}$/.test(val)){preview.innerHTML=`<img src="https://img.youtube.com/vi/${val}/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/${val}/hqdefault.jpg'">`;preview.style.display='block';}else{preview.style.display='none';}});
}

async function loadVideos(){
  const {data,error}=await db.from('videos').select('*').order('sort_order',{ascending:true}).order('id',{ascending:true});
  if(error)return;
  allVideosCache=data||[];
  renderVideoList();
}

function renderVideoList(){
  const el=document.getElementById('adminList');const cnt=document.getElementById('videosCount');if(!el)return;
  if(cnt)cnt.innerHTML=`<strong>${allVideosCache.length}</strong>`;
  if(!allVideosCache.length){el.innerHTML='<div class="empty"><h3>Нет видео</h3></div>';return;}
  const typeLabels={live:'LIVE',report:'Репортаж',vertical:'Вертикаль'};
  el.innerHTML=allVideosCache.map(v=>{
    const cover=v.cover_image||`https://img.youtube.com/vi/${v.video_id}/maxresdefault.jpg`;
    return `<div class="admin-item" draggable="true" data-video-id="${v.id}" style="cursor:grab;">
      <div class="drag-handle" style="display:flex;align-items:center;color:var(--muted-soft);padding:8px;cursor:grab;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="5" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="9" cy="19" r="1"/><circle cx="15" cy="5" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="15" cy="19" r="1"/></svg>
      </div>
      <div class="admin-item-img"><img src="${escapeHtml(cover)}" onerror="this.src='https://img.youtube.com/vi/${v.video_id}/hqdefault.jpg'" alt=""></div>
      <div class="admin-item-body">
        <div class="admin-item-badges"><span class="admin-badge cat">${typeLabels[v.type]||v.type}</span>${v.is_live?'<span class="admin-badge urgent">LIVE</span>':''}${v.status==='draft'?'<span class="admin-badge draft">Черновик</span>':''}${v.cover_image?'<span class="admin-badge new">Своя обложка</span>':''}</div>
        <div class="admin-item-title">${escapeHtml(v.title)}</div>
        <div class="admin-item-meta"><span>${escapeHtml(v.duration||'—')}</span><span>· порядок: ${v.sort_order||0}</span></div>
      </div>
      <div class="admin-item-actions">
        <button class="action-btn edit" onclick="editVideo(${Number(v.id)})" title="Ред."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="action-btn danger" onclick="deleteVideo(${Number(v.id)})" title="Удалить"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div>
    </div>`;
  }).join('');
  let dragSrcId=null;
  el.querySelectorAll('[data-video-id]').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragSrcId=Number(row.dataset.videoId);row.style.opacity='0.4';e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{row.style.opacity='';el.querySelectorAll('[data-video-id]').forEach(r=>r.style.borderTop='');});
    row.addEventListener('dragover',e=>{e.preventDefault();if(Number(row.dataset.videoId)===dragSrcId)return;row.style.borderTop='3px solid var(--accent)';});
    row.addEventListener('dragleave',()=>{row.style.borderTop='';});
    row.addEventListener('drop',async e=>{
      e.preventDefault();row.style.borderTop='';
      const targetId=Number(row.dataset.videoId);if(dragSrcId===targetId)return;
      const srcIdx=allVideosCache.findIndex(v=>v.id===dragSrcId);
      const tgtIdx=allVideosCache.findIndex(v=>v.id===targetId);
      if(srcIdx<0||tgtIdx<0)return;
      const [moved]=allVideosCache.splice(srcIdx,1);allVideosCache.splice(tgtIdx,0,moved);
      for(let i=0;i<allVideosCache.length;i++){allVideosCache[i].sort_order=i+1;}
      try{await Promise.all(allVideosCache.map(v=>db.from('videos').update({sort_order:v.sort_order}).eq('id',v.id)));toast('Порядок сохранён');}
      catch(err){toast('Ошибка сохранения порядка','error');}
      renderVideoList();
    });
  });
}

async function editVideo(id){
  const {data}=await db.from('videos').select('*').eq('id',id).single();
  if(!data){toast('Ошибка','error');return;}
  editingVideoId=id;loadVideosTab();
  setTimeout(()=>{
    document.getElementById('videoFormTitle').textContent='✏️ Редактировать видео';
    document.getElementById('vType').value=data.type||'live';
    document.getElementById('vDur').value=data.duration||'';
    document.getElementById('vId').value=data.video_id||'';
    document.getElementById('vTitle').value=data.title||'';
    document.getElementById('vShort').value=data.short||'';
    document.getElementById('vLive').checked=!!data.is_live;
    document.getElementById('vDraft').checked=data.status==='draft';
    document.getElementById('vId').dispatchEvent(new Event('input'));
    if(data.cover_image)setVideoCoverPreview(data.cover_image);else clearVideoCover();
    toast('Режим редактирования');
  },200);
}
function cancelVideoEdit(){editingVideoId=null;clearVideoCover();loadVideosTab();}
function previewVideoCover(input){const file=input.files[0];if(!file){clearVideoCover();return;}const url=URL.createObjectURL(file);pendingVideoCoverBlob=file;pendingVideoCoverUrl=url;const box=document.getElementById('vCoverPreview');box.innerHTML=`<img src="${url}" alt="">`;document.getElementById('vCoverClearBtn').style.display='inline-flex';}
function clearVideoCover(){pendingVideoCoverBlob=null;if(pendingVideoCoverUrl){URL.revokeObjectURL(pendingVideoCoverUrl);pendingVideoCoverUrl=null;}const box=document.getElementById('vCoverPreview');if(box)box.innerHTML='Нет';const inp=document.getElementById('vCover');if(inp)inp.value='';const btn=document.getElementById('vCoverClearBtn');if(btn)btn.style.display='none';}
function setVideoCoverPreview(url){const box=document.getElementById('vCoverPreview');if(!box)return;if(url){box.innerHTML=`<img src="${escapeHtml(url)}" alt="">`;document.getElementById('vCoverClearBtn').style.display='inline-flex';}else{box.innerHTML='Нет';document.getElementById('vCoverClearBtn').style.display='none';}pendingVideoCoverUrl=url||null;pendingVideoCoverBlob=null;}

async function submitVideo(e){
  e.preventDefault();const btn=e.target.querySelector('button[type=submit]');
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Сохранение...';
  try{
    const videoId=document.getElementById('vId').value.trim();
    if(!isValidYT(videoId))throw new Error('YouTube ID должен быть 11 символов');
    let coverUrl=pendingVideoCoverUrl||null;
    if(pendingVideoCoverBlob){coverUrl=await uploadImage(pendingVideoCoverBlob);}
    const payload={type:document.getElementById('vType').value,video_id:videoId,title:document.getElementById('vTitle').value,short:document.getElementById('vShort').value,duration:document.getElementById('vDur').value,is_live:document.getElementById('vLive').checked,status:document.getElementById('vDraft').checked?'draft':'published',cover_image:coverUrl};
    if(editingVideoId){
      const {error}=await db.from('videos').update(payload).eq('id',editingVideoId);
      if(error)throw error;toast('Обновлено');editingVideoId=null;
    }else{
      const {data:maxRow}=await db.from('videos').select('sort_order').order('sort_order',{ascending:false}).limit(1).maybeSingle();
      payload.sort_order=(maxRow?.sort_order||0)+1;
      const {error}=await db.from('videos').insert(payload);
      if(error)throw error;toast('Видео добавлено');
    }
    clearVideoCover();loadVideosTab();
  }catch(err){toast('Ошибка: '+(err.message||''),'error');}
  finally{btn.disabled=false;btn.innerHTML='Сохранить';}
}

async function deleteVideo(id){
  if(!confirm('Удалить видео?'))return;
  const {error}=await db.from('videos').delete().eq('id',id);
  if(error){toast('Ошибка','error');return;}
  toast('Удалено');loadVideosTab();
}

async function uploadImage(file){
  const ext=file.name.split('.').pop().toLowerCase();
  const name=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await db.storage.from('news-images').upload(name,file);
  if(error)throw error;
  const {data}=db.storage.from('news-images').getPublicUrl(name);
  return data.publicUrl;
}
</script>
</body>
</html>
