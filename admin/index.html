<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Вход — Админ-панель</title>
<link rel="icon" href="../file/main.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-left">
    <div class="login-brand"><img src="../file/main.png" alt="Метро New"><div class="login-brand-text">Метро New<em>International</em></div></div>
    <div class="login-hero"><h1>Панель управления редакцией</h1><p>Войдите, чтобы управлять новостями.</p></div>
  </div>
  <div class="login-right">
    <div class="login-box">
      <div class="login-step active" data-step="1">
        <h2>Вход для админа</h2>
        <p class="sub">Введите email и пароль.</p>
        <form onsubmit="handleLogin(event)" id="loginForm">
          <div class="form-group"><label>Email</label><input type="email" id="loginEmail" required autocomplete="email" autofocus></div>
          <div class="form-group"><label>Пароль</label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
          <button type="submit" class="submit-btn" id="loginSubmitBtn">Войти</button>
        </form>
      </div>
      <div class="login-step" data-step="2">
        <button type="button" class="login-back" onclick="showLoginStep(1)">← Назад</button>
        <h2>Код 2FA</h2>
        <p class="sub">Введите 6 цифр из Google Authenticator</p>
        <form onsubmit="verify2FALogin(event)" id="twofaLoginForm">
          <div class="form-group"><label>Код</label><input type="text" id="twofaLoginCode" maxlength="6" inputmode="numeric" required class="code-input" placeholder="000000"></div>
          <button type="submit" class="submit-btn" id="twofaLoginBtn">Подтвердить</button>
        </form>
      </div>
      <div class="error-msg" id="loginError"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="auth.js"></script>
<script>
function showLoginStep(step){document.querySelectorAll('.login-step').forEach(s=>s.classList.toggle('active',s.dataset.step===String(step)));}

async function handleLogin(e){
  e.preventDefault();
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginError');
  const btn=document.getElementById('loginSubmitBtn');
  errEl.classList.remove('active');
  btn.disabled=true;btn.textContent='Проверка...';
  try{
    const {data:authData,error:authError}=await db.auth.signInWithPassword({email,password});
    if(authError)throw new Error('Неверный email или пароль');
    const {data:adminRow}=await db.from('admins').select('uid').eq('user_id',authData.user.id).maybeSingle();
    if(!adminRow){await db.auth.signOut();throw new Error('Нет прав администратора');}
    const {data:aal}=await db.auth.mfa.getAuthenticatorAssuranceLevel();
    if(aal?.currentLevel==='aal1'&&aal?.nextLevel==='aal2'){
      showLoginStep(2);
      document.getElementById('twofaLoginCode').focus();
      return;
    }
    window.location.href='news/index.html';
  }catch(err){errEl.textContent=err.message;errEl.classList.add('active');}
  finally{btn.disabled=false;btn.textContent='Войти';}
}

async function verify2FALogin(e){
  e.preventDefault();
  const code=document.getElementById('twofaLoginCode').value.trim();
  const errEl=document.getElementById('loginError');
  const btn=document.getElementById('twofaLoginBtn');
  errEl.classList.remove('active');
  btn.disabled=true;btn.textContent='Проверка...';
  try{
    const {data:factors}=await db.auth.mfa.listFactors();
    if(!factors?.totp?.length)throw new Error('2FA не настроен');
    const factorId=factors.totp[0].id;
    const {data:challenge,error:chErr}=await db.auth.mfa.challenge({factorId});
    if(chErr)throw chErr;
    const {error:vErr}=await db.auth.mfa.verify({factorId,challengeId:challenge.id,code});
    if(vErr)throw new Error('Неверный код');
    window.location.href='news/index.html';
  }catch(err){errEl.textContent=err.message;errEl.classList.add('active');}
  finally{btn.disabled=false;btn.textContent='Подтвердить';}
}

(async()=>{
  const {data:{session}}=await db.auth.getSession();
  if(!session)return;
  const {data:aal}=await db.auth.mfa.getAuthenticatorAssuranceLevel();
  if(aal?.currentLevel==='aal2'||aal?.nextLevel!=='aal2'){
    window.location.href='news/index.html';
  }
})();
</script>
</body>
</html>
