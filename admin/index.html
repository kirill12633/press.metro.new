<head>

.md-btn:hover{background:var(--soft);border-color:var(--text);}
.quick-schedule{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.quick-btn{background:var(--bg-alt);border:1.5px solid var(--line);color:var(--text-soft);padding:8px 12px;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;border-radius:var(--radius-full);min-height:36px;}
.quick-btn:hover{background:var(--soft);border-color:var(--accent);color:var(--accent);}
.schedule-warning{color:var(--accent);font-size:12px;font-weight:600;margin-top:6px;display:none;}

.media-picker-item:hover{border-color:var(--accent);}
.media-picker-item img{width:100%;height:100%;object-fit:cover;display:block;}
</style>
</head>
<body>

<script>
const CATEGORY_NAMES={world:'Мир',tech:'Технологии',culture:'Культура',sport:'Спорт',weather:'Погода',other:'Другое'};
const DRAFT_KEY='metro_admin_news_draft';
let savedBody='',draftSaveTimeout=null,draftIndicatorTimeout=null;
let cropperInstance=null,cropperResolve=null;
let currentUserId=null;
let editingId=null;

function closePreview(){document.getElementById('previewModal').classList.remove('open');document.body.style.overflow='';}
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

(async()=>{
  const session=await requireAuth();
  if(!session)return;
  currentUserId=session.user.id;
  const params=new URLSearchParams(window.location.search);
  const editId=params.get('edit');
  loadCreateTab();
  if(editId){ setTimeout(()=>loadEdit(editId), 300); }
})();

async function loadEdit(id){
  const {data,error}=await db.from('news').select('*').eq('id',id).single();
  if(error||!data){ toast('Новость не найдена','error'); return; }
  editingId=Number(id);
  document.getElementById('pageTitle').textContent='✏️ Редактировать новость';
  document.getElementById('nCat').value=data.category_slug||'other';
  document.getElementById('nAuthor').value=data.author||'Редакция Метро New';
  document.getElementById('nTitle').value=data.title||'';
  document.getElementById('nExcerpt').value=data.excerpt||'';
  document.getElementById('nBody').value=data.body||'';
  document.getElementById('nPhotoAuthor').value=data.photo_author||'';
  document.getElementById('nNew').checked=!!data.is_new;
  document.getElementById('nUrgent').checked=!!data.is_urgent;
  document.getElementById('nDraft').checked=data.status==='draft';
  if(data.scheduled_at)document.getElementById('nScheduledAt').value=data.scheduled_at.slice(0,16);
  if(data.cover_image){const p=document.getElementById('nCoverPreview');p.innerHTML=`<img src="${escapeHtml(data.cover_image)}">`;p.dataset.url=data.cover_image;}
  if(data.author_avatar){const p=document.getElementById('nAvatarPreview');p.innerHTML=`<img src="${escapeHtml(data.author_avatar)}">`;p.dataset.url=data.author_avatar;}
  const btn=document.querySelector('#newsFormEl button[type=submit]');
  if(btn)btn.textContent='Сохранить';
  updateCharCounter('nTitle','nTitleCounter',100);
  updateCharCounter('nExcerpt','nExcerptCounter',300);
  updateWordCount();
  toast('Режим редактирования');
}

function loadCreateTab(){
  document.getElementById('adminContent').innerHTML=`
    <div style="max-width:820px;margin:0 auto;">
      <div class="form-card">
        <div class="form-card-header"><h3>+ Новая новость</h3><div class="draft-indicator" id="draftIndicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Сохранено</div></div>
        <form onsubmit="submitNews(event)" id="newsFormEl" oninput="autoSaveNewsDraft()" novalidate>
          <div class="form-section open">
            <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Основное<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
            <div class="form-section-body"><div class="form-section-body-inner">
              <div class="form-row">
                <div class="form-group" id="fgCat"><label>Рубрика *</label><select id="nCat">${Object.entries(CATEGORY_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><div class="field-error">Выберите</div></div>
                <div class="form-group" id="fgAuthor"><label>Автор *</label><input id="nAuthor" value="Редакция Метро New"><div class="field-error">Укажите автора</div></div>
              </div>
              <div class="form-group" id="fgTitle"><label>Заголовок *</label><input id="nTitle" maxlength="100" required oninput="updateCharCounter('nTitle','nTitleCounter',100)"><div class="char-counter" id="nTitleCounter">0 / 100</div><div class="field-error">Обязательно</div></div>
              <div class="form-group" id="fgExcerpt"><label>Краткое описание *</label><textarea id="nExcerpt" rows="2" maxlength="300" oninput="updateCharCounter('nExcerpt','nExcerptCounter',300)"></textarea><div class="char-counter" id="nExcerptCounter">0 / 300</div><div class="field-error">10–300 символов</div></div>
            </div></div>
          </div>
          <div class="form-section">
            <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Медиа<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
            <div class="form-section-body"><div class="form-section-body-inner">
              <div class="form-row">
                <div class="form-group" id="fgCover"><label>Обложка *</label><div class="image-upload"><label class="upload-btn" for="nCover">Файл</label><input type="file" id="nCover" accept="image/*" onchange="previewImage(this,'nCoverPreview')"><div class="upload-preview" id="nCoverPreview">Нет фото</div></div><div class="field-error">Загрузите</div></div>
                <div class="form-group"><label>Фото автора</label><div class="image-upload"><label class="upload-btn" for="nAvatar">Файл</label><input type="file" id="nAvatar" accept="image/*" onchange="previewImage(this,'nAvatarPreview')"><div class="upload-preview" id="nAvatarPreview">Нет фото</div></div></div>
              </div>
              <div class="form-group"><label>Автор фото (подпись)</label><input id="nPhotoAuthor" placeholder="Иван Петров / Reuters"><p class="md-help">Появится как «Фото: Иван Петров»</p></div>
            </div></div>
          </div>
          <div class="form-section open">
            <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Текст (Markdown)<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
            <div class="form-section-body"><div class="form-section-body-inner">
              <div class="form-group" id="fgBody">
                <div class="md-tabs"><button type="button" class="md-tab active" onclick="mdTab(this,'edit')">Редактор</button><button type="button" class="md-tab" onclick="mdTab(this,'preview')">Предпросмотр</button></div>
                <div class="md-toolbar">
                  <button type="button" class="md-btn" onclick="mdInsert('**','**')" title="Жирный"><b>B</b></button>
                  <button type="button" class="md-btn" onclick="mdInsert('*','*')" title="Курсив"><i>I</i></button>
                  <button type="button" class="md-btn" onclick="mdInsert('# ','')" title="H1">H1</button>
                  <button type="button" class="md-btn" onclick="mdInsert('## ','')" title="H2">H2</button>
                  <button type="button" class="md-btn" onclick="mdInsert('[','](url)')" title="Ссылка">🔗</button>
                  <button type="button" class="md-btn" onclick="mdInsert('> ','')" title="Цитата">❝</button>
                  <button type="button" class="md-btn" onclick="mdInsert('- ','')" title="Список">•</button>
                  <button type="button" class="md-btn" onclick="openMediaPicker()" title="Картинка из медиатеки">🖼</button>
                  <button type="button" class="md-btn" onclick="insertYouTube()" title="YouTube-видео">▶</button>
                </div>
                <textarea id="nBody" rows="12" style="font-family:monospace;font-size:14px;" placeholder="# Заголовок&#10;&#10;Текст..." oninput="updateWordCount()"></textarea>
                <div class="char-counter" id="nBodyCounter" style="text-align:left;">0 слов · 0 мин чтения</div>
                <div id="nBodyPreview" style="display:none;background:var(--bg);padding:20px;margin-top:12px;border-radius:var(--radius-sm);border:1.5px solid var(--line);min-height:200px;"></div>
                <div class="field-error">Мин. 50 символов</div>
              </div>
            </div></div>
          </div>
          <div class="form-section">
            <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Публикация<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
            <div class="form-section-body"><div class="form-section-body-inner">
              <div class="form-group"><label for="nScheduledAt">Дата и время публикации</label><input type="datetime-local" id="nScheduledAt" onchange="checkScheduleDate()"><p class="md-help" id="scheduleHint">Пусто — опубликуется сразу. Будущее — отложенная.</p><div class="schedule-warning" id="scheduleWarning">⚠ Дата в прошлом — новость не опубликуется</div></div>
              <div class="quick-schedule">
                <button type="button" class="quick-btn" onclick="setScheduleSlot(9,0)">⏰ 9:00</button>
                <button type="button" class="quick-btn" onclick="setScheduleSlot(12,0)">⏰ 12:00</button>
                <button type="button" class="quick-btn" onclick="setScheduleSlot(18,0)">⏰ 18:00</button>
                <button type="button" class="quick-btn" onclick="setScheduleIn(60)">⏱ Через 1 час</button>

                <button type="button" class="quick-btn" onclick="document.getElementById('nScheduledAt').value='';checkScheduleDate();">✕ Сбросить</button>
              </div>
              <div class="checkbox-row"><label class="checkbox-label"><input type="checkbox" id="nNew"> NEW</label><label class="checkbox-label"><input type="checkbox" id="nUrgent"> 🔴 Срочная</label><label class="checkbox-label"><input type="checkbox" id="nDraft"> 💾 Черновик</label></div>
              <div class="checkbox-row"><label class="checkbox-label publish-social"><input type="checkbox" id="nPublishSocial" checked> 📢 Опубликовать в Telegram и Discord</label></div>
            </div></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="submit-btn primary">Опубликовать</button>
            <button type="button" class="submit-btn secondary" onclick="previewNews()">Предпросмотр</button>
            <button type="button" class="submit-btn secondary" onclick="clearFormAndDraft()">Очистить</button>
          </div>
        </form>
      </div>
      <div class="form-card" style="margin-top:24px;">
        <div class="form-card-header"><h3>📥 Импорт из JSON</h3></div>
        <p class="md-help" style="margin-bottom:12px;">Вставь JSON-массив новостей. Каждый объект: title, excerpt, body, category_slug, cover_image.</p>
        <textarea id="jsonInput" rows="10" style="width:100%;font-family:monospace;font-size:13px;padding:12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);" placeholder='[{"title":"Заголовок","excerpt":"Описание","body":"Текст","category_slug":"world"}]'></textarea>
        <div class="form-actions" style="margin-top:12px;">
          <button type="button" class="submit-btn primary" onclick="importFromJSON()">📥 Импортировать</button>
          <button type="button" class="submit-btn secondary" onclick="document.getElementById('jsonInput').value=''">Очистить</button>
        </div>
        <div id="jsonStatus" style="margin-top:12px;font-size:14px;color:var(--muted);"></div>
      </div>
    </div>`;
  setTimeout(()=>{loadNewsDraft();updateWordCount();},100);

/* ===== Markdown toolbar ===== */
function mdInsert(before,after){
  const ta=document.getElementById('nBody');
  if(!ta)return;
  const start=ta.selectionStart,end=ta.selectionEnd;
  const text=ta.value;
  const selected=text.slice(start,end)||'текст';
  ta.value=text.slice(0,start)+before+selected+after+text.slice(end);
  ta.focus();
  ta.setSelectionRange(start+before.length,start+before.length+selected.length);
  updateWordCount();
}
function updateWordCount(){
  const ta=document.getElementById('nBody');
  const el=document.getElementById('nBodyCounter');
  if(!ta||!el)return;
  const words=ta.value.trim().split(/\s+/).filter(Boolean).length;
  const mins=Math.max(1,Math.ceil(words/200));
  el.textContent=`${words} слов · ${mins} мин чтения`;
}
function insertYouTube(){
  const url=prompt('Вставь ссылку на YouTube или ID видео:');
  if(!url)return;
  let id=url;
  const m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_\-]{11})/);
  if(m)id=m[1];
  if(!/^[A-Za-z0-9_\-]{11}$/.test(id)){toast('Неверный YouTube ID','error');return;}
  const md=`\n\n<div class="yt-embed"><iframe width="100%" height="400" src="https://www.youtube-nocookie.com/embed/${id}" frameborder="0" allowfullscreen></iframe></div>\n\n`;
  const ta=document.getElementById('nBody');
  const pos=ta.selectionStart;
  ta.value=ta.value.slice(0,pos)+md+ta.value.slice(pos);
  updateWordCount();
  toast('Видео вставлено');
}

/* ===== Медиатека ===== */
async function openMediaPicker(){
  document.getElementById('mediaPickerModal').classList.add('open');
  const grid=document.getElementById('mediaPickerGrid');
  grid.innerHTML='<div class="empty" style="grid-column:1/-1;padding:20px;">Загрузка...</div>';
  try{
    const {data,error}=await db.storage.from('news-images').list('',{limit:100,sortBy:{column:'created_at',order:'desc'}});
    if(error)throw error;
    const files=(data||[]).filter(f=>f.name&&!f.name.endsWith('/'));
    if(!files.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1;padding:20px;">Нет фото</div>';return;}
    grid.innerHTML=files.map(f=>{
      const {data:u}=db.storage.from('news-images').getPublicUrl(f.name);
      return `<div class="media-picker-item" onclick="insertMediaImage('${escapeHtml(u.publicUrl)}')"><img src="${escapeHtml(u.publicUrl)}" alt=""></div>`;
    }).join('');
  }catch(e){grid.innerHTML='<div class="empty" style="grid-column:1/-1;padding:20px;">Ошибка</div>';}
}
function closeMediaPicker(){document.getElementById('mediaPickerModal').classList.remove('open');}
function insertMediaImage(url){
  const md=`\n\n![фото](${url})\n\n`;
  const ta=document.getElementById('nBody');
  const pos=ta.selectionStart;
  ta.value=ta.value.slice(0,pos)+md+ta.value.slice(pos);
  updateWordCount();
  closeMediaPicker();
  toast('Фото вставлено');
}

/* ===== Слоты публикации ===== */
function setScheduleSlot(h,m){
  const d=new Date();
  d.setHours(h,m,0,0);
  if(d<new Date())d.setDate(d.getDate()+1);
  document.getElementById('nScheduledAt').value=d.toISOString().slice(0,16);
  checkScheduleDate();
}
function setScheduleIn(min){
  const d=new Date(Date.now()+min*60000);
  document.getElementById('nScheduledAt').value=d.toISOString().slice(0,16);
  checkScheduleDate();
}
function setScheduleTomorrow(h,m){
  const d=new Date();
  d.setDate(d.getDate()+1);
  d.setHours(h,m,0,0);
  document.getElementById('nScheduledAt').value=d.toISOString().slice(0,16);
  checkScheduleDate();
}
function checkScheduleDate(){
  const inp=document.getElementById('nScheduledAt');
  const warn=document.getElementById('scheduleWarning');
  if(!inp||!warn)return;
  if(inp.value&&new Date(inp.value)<=new Date()){
    warn.classList.add('active');
  }else{
    warn.classList.remove('active');
  }
}

/* ===== Остальное ===== */
function validateField(fgId,condition){const fg=document.getElementById(fgId);if(!fg)return true;if(condition){fg.classList.remove('has-error');return true;}fg.classList.add('has-error');return false;}
function validateForm(){let ok=true;if(!validateField('fgCat',!!document.getElementById('nCat')?.value))ok=false;if(!validateField('fgAuthor',document.getElementById('nAuthor')?.value.trim().length>=2))ok=false;if(!validateField('fgTitle',document.getElementById('nTitle')?.value.trim().length>=2))ok=false;if(!validateField('fgExcerpt',document.getElementById('nExcerpt')?.value.trim().length>=10))ok=false;if(!validateField('fgCover',!!document.getElementById('nCoverPreview')?.dataset.url||document.getElementById('nCover')?.files.length>0))ok=false;if(!validateField('fgBody',document.getElementById('nBody')?.value.trim().length>=50))ok=false;return ok;}
function updateCharCounter(inId,cntId,max){const inp=document.getElementById(inId),el=document.getElementById(cntId);if(!inp||!el)return;const len=inp.value.length;el.textContent=`${len} / ${max}`;el.classList.remove('warning','danger');if(len>max*0.9)el.classList.add('danger');else if(len>max*0.75)el.classList.add('warning');}
function saveDraftNow(){if(editingId)return;const titleEl=document.getElementById('nTitle');if(!titleEl)return;const draft={cat:document.getElementById('nCat')?.value,title:titleEl.value,excerpt:document.getElementById('nExcerpt')?.value,author:document.getElementById('nAuthor')?.value,body:document.getElementById('nBody')?.value,photoAuthor:document.getElementById('nPhotoAuthor')?.value};if(!draft.title&&!draft.body)return;try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));const ind=document.getElementById('draftIndicator');if(ind){ind.classList.add('active');clearTimeout(draftIndicatorTimeout);draftIndicatorTimeout=setTimeout(()=>ind.classList.remove('active'),2000);}}catch(e){}}
function autoSaveNewsDraft(){clearTimeout(draftSaveTimeout);draftSaveTimeout=setTimeout(saveDraftNow,500);}
function loadNewsDraft(){if(editingId)return;try{const raw=localStorage.getItem(DRAFT_KEY);if(!raw)return;const d=JSON.parse(raw);if(!d||(!d.title&&!d.body))return;if(document.getElementById('nCat'))document.getElementById('nCat').value=d.cat||'other';if(document.getElementById('nTitle'))document.getElementById('nTitle').value=d.title||'';if(document.getElementById('nExcerpt'))document.getElementById('nExcerpt').value=d.excerpt||'';if(document.getElementById('nAuthor'))document.getElementById('nAuthor').value=d.author||'Редакция Метро New';if(document.getElementById('nBody'))document.getElementById('nBody').value=d.body||'';if(document.getElementById('nPhotoAuthor'))document.getElementById('nPhotoAuthor').value=d.photoAuthor||'';toast('Черновик восстановлен');}catch(e){}}
function clearNewsDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
function clearFormAndDraft(){if(!confirm('Очистить форму и черновик?'))return;editingId=null;document.getElementById('newsFormEl')?.reset();['nCoverPreview','nAvatarPreview'].forEach(id=>{const el=document.getElementById(id);if(el){el.innerHTML='Нет фото';delete el.dataset.url;}});clearNewsDraft();updateWordCount();toast('Форма очищена');}

function mdTab(btn,mode){document.querySelectorAll('.md-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const ta=document.getElementById('nBody');const prev=document.getElementById('nBodyPreview');if(!ta)return;if(mode==='preview'){savedBody=ta.value;ta.style.display='none';prev.style.display='block';prev.innerHTML=window.DOMPurify.sanitize(window.marked.parse(ta.value||'',{breaks:true,gfm:true}));}else{ta.style.display='block';prev.style.display='none';if(savedBody)ta.value=savedBody;}}

function previewNews(){const title=document.getElementById('nTitle').value||'Без заголовка';const excerpt=document.getElementById('nExcerpt').value;const body=document.getElementById('nBody').value;const cat=CATEGORY_NAMES[document.getElementById('nCat').value]||'Другое';const cover=document.getElementById('nCoverPreview').dataset.url;const photoAuthor=document.getElementById('nPhotoAuthor')?.value.trim();document.getElementById('previewContent').innerHTML=`<div class="preview-meta"><span class="preview-cat">${cat}</span><span>${new Date().toLocaleDateString('ru-RU')}</span></div><h1>${escapeHtml(title)}</h1>${cover?`<div class="preview-cover"><img src="${escapeHtml(cover)}"></div>${photoAuthor?`<div class="preview-cover-caption">Фото: ${escapeHtml(photoAuthor)}</div>`:''}`:''}${excerpt?`<p style="font-size:16px;color:var(--muted);margin-bottom:24px;">${escapeHtml(excerpt)}</p>`:''}<div class="preview-body">${window.DOMPurify.sanitize(window.marked.parse(body||'',{breaks:true,gfm:true}))}</div>`;document.getElementById('previewModal').classList.add('open');}

async function submitNews(e){
  e.preventDefault();
  if(!validateForm()){toast('Заполните все поля','error');return;}
  const btn=e.target.querySelector('button[type=submit]');const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Сохранение...';
  try{
    let coverUrl=document.getElementById('nCoverPreview').dataset.url||null;
    let avatarUrl=document.getElementById('nAvatarPreview').dataset.url||null;
    const cf=document.getElementById('nCover').files[0];if(cf)coverUrl=await uploadImage(cf);
    const af=document.getElementById('nAvatar').files[0];if(af)avatarUrl=await uploadImage(af);
    const scheduledAt=document.getElementById('nScheduledAt').value;
    const isDraft=document.getElementById('nDraft').checked;
    let status='published';
    if(isDraft)status='draft';
    else if(scheduledAt&&new Date(scheduledAt)>new Date())status='scheduled';
    const payload={category_slug:document.getElementById('nCat').value,title:document.getElementById('nTitle').value,excerpt:document.getElementById('nExcerpt').value,body:document.getElementById('nBody').value,cover_image:coverUrl,author:document.getElementById('nAuthor').value||'Редакция Метро New',author_avatar:avatarUrl,photo_author:document.getElementById('nPhotoAuthor')?.value.trim()||null,is_new:document.getElementById('nNew').checked,is_urgent:document.getElementById('nUrgent').checked,status:status,scheduled_at:scheduledAt||null,user_id:currentUserId};
    if(editingId){
      const {error}=await db.from('news').update(payload).eq('id',editingId);
      if(error)throw error;
      toast('Обновлено');
    }else{
      const {data:inserted,error}=await db.from('news').insert(payload).select('id').single();
      if(error)throw error;
      const publishSocial=document.getElementById('nPublishSocial')?.checked;
      if(status==='published'&&publishSocial&&inserted?.id){
        try{
          const res=await fetch(`${SUPABASE_URL}/functions/v1/publish-news`,{method:'POST',headers:{'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({newsId:inserted.id})});
          const result=await res.json();
          if(result.telegram==='ok'&&result.discord==='ok')toast('✅ Опубликовано в ТГ и ДС');
          else toast(`ТГ: ${result.telegram}, ДС: ${result.discord}`,'error');
        }catch(e){toast('Сохранено, но соцсети не ответили','error');}
      }else{toast(status==='draft'?'Черновик сохранён':status==='scheduled'?'Запланировано':'Опубликовано');}
    }
    clearNewsDraft();
    if(!editingId){document.getElementById('newsFormEl').reset();['nCoverPreview','nAvatarPreview'].forEach(id=>{const el=document.getElementById(id);if(el){el.innerHTML='Нет фото';delete el.dataset.url;}});updateWordCount();}
  }catch(err){toast('Ошибка: '+(err.message||''),'error');}
  finally{btn.disabled=false;btn.innerHTML=orig;}
}

async function importFromJSON(){
  const raw=document.getElementById('jsonInput').value.trim();
  const status=document.getElementById('jsonStatus');
  if(!raw){status.textContent='Вставь JSON';status.style.color='var(--accent)';return;}
  let items;
  try{items=JSON.parse(raw);if(!Array.isArray(items))items=[items];}
  catch(e){status.textContent='Ошибка JSON: '+e.message;status.style.color='var(--accent)';return;}
  if(!items.length){status.textContent='Массив пуст';status.style.color='var(--accent)';return;}
  status.textContent=`Импорт ${items.length} новостей...`;status.style.color='var(--muted)';
  let ok=0,fail=0;const errors=[];
  for(const item of items){
    const title=(item.title||'').trim();
    if(!title){fail++;errors.push('Пропущен: нет title');continue;}
    const payload={title,excerpt:(item.excerpt||item.description||'').slice(0,300),body:item.body||item.excerpt||item.description||'',category_slug:item.category_slug||item.category||'world',cover_image:item.cover_image||item.image||null,author:item.author||'JSON Import',photo_author:item.photo_author||null,status:item.status||'published',is_new:item.is_new||false,is_urgent:item.is_urgent||false,published_at:item.published_at||new Date().toISOString(),source_url:item.source_url||item.url||null,user_id:currentUserId};
    if(payload.source_url){const {data:existing}=await db.from('news').select('id').eq('source_url',payload.source_url).maybeSingle();if(existing){fail++;continue;}}
    const {data:inserted,error}=await db.from('news').insert(payload).select('id').single();
    if(error){fail++;errors.push(`${title}: ${error.message}`);continue;}
    ok++;
    if(payload.status==='published'&&inserted?.id){
      try{await fetch(`${SUPABASE_URL}/functions/v1/publish-news`,{method:'POST',headers:{'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({newsId:inserted.id})});}catch(e){}
    }
  }
  status.innerHTML=`✅ Импортировано: <strong>${ok}</strong>${fail?` · ❌ Ошибок: <strong>${fail}</strong>`:''}`;
  status.style.color=ok>0?'var(--success)':'var(--accent)';
  if(errors.length)console.warn('Ошибки импорта:',errors);
  document.getElementById('jsonInput').value='';
  toast(`Импортировано: ${ok}${fail?`, ошибок: ${fail}`:''}`,ok>0?'success':'error');
}

function previewImage(input,previewId){
  const file=input.files[0];
  if(!file){const box=document.getElementById(previewId);box.innerHTML='Нет фото';delete box.dataset.url;return;}
  openCropper(file,(blob)=>{if(!blob){input.value='';return;}const url=URL.createObjectURL(blob);const box=document.getElementById(previewId);box.innerHTML=`<img src="${url}" alt="">`;box._pendingBlob=blob;});
}
function openCropper(file,cb){
  const reader=new FileReader();
  reader.onload=(e)=>{
    document.getElementById('cropperImage').src=e.target.result;
    document.getElementById('cropperModal').classList.add('open');
    cropperResolve=cb;
    if(cropperInstance){cropperInstance.destroy();cropperInstance=null;}
    setTimeout(()=>{cropperInstance=new Cropper(document.getElementById('cropperImage'),{aspectRatio:16/9,viewMode:1,autoCropArea:1,background:false});},100);
  };
  reader.readAsDataURL(file);
  document.querySelectorAll('.crop-ratio-btn').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.crop-ratio-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(cropperInstance){const ratio=btn.dataset.ratio==='NaN'?NaN:eval(btn.dataset.ratio);cropperInstance.setAspectRatio(ratio);}};});
}
function confirmCrop(){
  if(!cropperInstance){closeCropper();return;}
  cropperInstance.getCroppedCanvas({maxWidth:1920,maxHeight:1920,imageSmoothingQuality:'high'}).toBlob((blob)=>{if(cropperResolve)cropperResolve(blob);closeCropper();},'image/jpeg',0.9);
}
function closeCropper(){document.getElementById('cropperModal').classList.remove('open');if(cropperInstance){cropperInstance.destroy();cropperInstance=null;}cropperResolve=null;}
async function uploadImage(file){
  const ext=file.name.split('.').pop().toLowerCase();
  const name=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await db.storage.from('news-images').upload(name,file);
  if(error)throw error;
  const {data}=db.storage.from('news-images').getPublicUrl(name);
  return data.publicUrl;
}
</script>
