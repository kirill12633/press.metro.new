<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Опубликованные — Админ-панель</title>
<link rel="icon" href="../../file/main.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap active">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="../../file/main.png" alt="Метро New"><div class="sidebar-brand-text">Метро New<em>Админ-панель</em></div></div>
    <nav class="sidebar-nav">
      <a class="sidebar-item" href="../news/">Создать</a>
      <a class="sidebar-item active" href="../published/">Опубликованные</a>
      <a class="sidebar-item" href="../calendar/">Календарь</a>
      <a class="sidebar-item" href="../media/">Медиа</a>
      <a class="sidebar-item" href="../videos/">Видео</a>
      <a class="sidebar-item" href="../analytics/">Аналитика</a>
      <a class="sidebar-item" href="../trash/">Корзина</a>
      <button class="sidebar-item" onclick="open2FASettings()">2FA</button>
    </nav>
    <div class="sidebar-footer">
      <a class="sidebar-item" href="../../">На сайт</a>
      <button class="sidebar-item sidebar-logout" onclick="logout()">Выйти</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><h1>Опубликованные</h1></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div id="adminContent"></div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="twofaModal">
  <div class="modal-preview" style="max-width:480px;">
    <button class="modal-preview-close" onclick="document.getElementById('twofaModal').classList.remove('open')">✕</button>
    <div class="preview-content" id="twofaContent"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="../auth.js"></script>
<script>
const CATEGORY_NAMES={world:'Мир',tech:'Технологии',culture:'Культура',sport:'Спорт',weather:'Погода',other:'Другое'};
const catName=s=>CATEGORY_NAMES[s]||'Другое';
const PER_PAGE=20;
let allNewsCache=[],currentPage=1,selectedIds=new Set(),currentUserId=null;
const fmtDate=d=>new Date(d).toLocaleDateString('ru-RU',{day:'numeric',month:'short',year:'numeric'});
function escapeHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

(async()=>{
  const session=await requireAuth();
  if(!session)return;
  currentUserId=session.user.id;
  loadList();
})();

async function loadList(){
  document.getElementById('adminContent').innerHTML=`
    <div class="toolbar">
      <div class="search-input"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="newsSearch" placeholder="Поиск..." oninput="renderList()"></div>
      <select id="newsCategoryFilter" onchange="renderList()"><option value="">Все категории</option>${Object.entries(CATEGORY_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
      <select id="newsStatusFilter" onchange="renderList()"><option value="">Все статусы</option><option value="published">Опубликовано</option><option value="draft">Черновики</option><option value="scheduled">Запланировано</option><option value="urgent">Срочные</option></select>
      <select id="newsAuthorFilter" onchange="renderList()"><option value="">Все авторы</option><option value="mine">👤 Только мои</option></select>
      <select id="newsSortFilter" onchange="renderList()"><option value="date_desc">Новые</option><option value="date_asc">Старые</option><option value="title_asc">А-Я</option></select>
      <button class="toolbar-btn danger" id="bulkDeleteBtn" onclick="bulkDelete()" disabled>В корзину (<span id="bulkCount">0</span>)</button>
    </div>
    <div class="list-header"><h3>Все новости <span class="list-count" id="newsCount"></span></h3></div>
    <div class="admin-list" id="adminList"><div class="empty"><p>Загрузка...</p></div></div>
    <div class="pagination" id="newsPagination"></div>`;
  const {data,error}=await db.from('news').select('*').is('deleted_at',null).order('published_at',{ascending:false});
  if(error){document.getElementById('adminList').innerHTML='<div class="empty"><h3>Ошибка</h3></div>';return;}
  allNewsCache=data||[];
  renderList();
}

function renderList(){
  const s=(document.getElementById('newsSearch')?.value||'').toLowerCase().trim();
  const c=document.getElementById('newsCategoryFilter')?.value||'';
  const st=document.getElementById('newsStatusFilter')?.value||'';
  const au=document.getElementById('newsAuthorFilter')?.value||'';
  const sort=document.getElementById('newsSortFilter')?.value||'date_desc';
  let list=[...allNewsCache];
  if(s)list=list.filter(n=>(n.title||'').toLowerCase().includes(s));
  if(c)list=list.filter(n=>n.category_slug===c);
  if(st==='published')list=list.filter(n=>n.status==='published'||!n.status);
  if(st==='draft')list=list.filter(n=>n.status==='draft');
  if(st==='scheduled')list=list.filter(n=>n.status==='scheduled');
  if(st==='urgent')list=list.filter(n=>n.is_urgent===true);
  if(au==='mine'&&currentUserId)list=list.filter(n=>n.user_id===currentUserId);
  if(sort==='date_desc')list.sort((a,b)=>new Date(b.published_at)-new Date(a.published_at));
  else if(sort==='date_asc')list.sort((a,b)=>new Date(a.published_at)-new Date(b.published_at));
  else if(sort==='title_asc')list.sort((a,b)=>(a.title||'').localeCompare(b.title||'','ru'));
  const total=list.length;const pages=Math.ceil(total/PER_PAGE)||1;if(currentPage>pages)currentPage=pages;
  const start=(currentPage-1)*PER_PAGE;const pageList=list.slice(start,start+PER_PAGE);
  const cntEl=document.getElementById('newsCount');if(cntEl)cntEl.innerHTML=`<strong>${total}</strong>`;
  const listEl=document.getElementById('adminList');
  if(!pageList.length){listEl.innerHTML='<div class="empty"><h3>Ничего не найдено</h3></div>';renderPagination(0,1);return;}
  listEl.innerHTML=pageList.map(n=>{
    const statusLabel=n.status==='draft'?'Черновик':n.status==='scheduled'?'Запланировано':'Опубликовано';
    const statusClass=n.status==='draft'?'draft':n.status==='scheduled'?'scheduled':'published';
    const isMine=n.user_id===currentUserId;
    return `<div class="admin-item">
      <input type="checkbox" class="admin-item-checkbox" data-id="${n.id}" onchange="toggleSelect(this)" ${selectedIds.has(n.id)?'checked':''}>
      ${n.cover_image?`<div class="admin-item-img"><img src="${escapeHtml(n.cover_image)}"></div>`:'<div class="admin-item-img" style="display:flex;align-items:center;justify-content:center;color:var(--muted-soft);font-size:11px;">Нет</div>'}
      <div class="admin-item-body">
        <div class="admin-item-badges"><span class="admin-badge cat">${escapeHtml(catName(n.category_slug))}</span><span class="admin-badge ${statusClass}">${statusLabel}</span>${isMine?'<span class="admin-badge mine">Моя</span>':''}${n.is_urgent?'<span class="admin-badge urgent">Срочно</span>':''}${n.is_new?'<span class="admin-badge new">NEW</span>':''}</div>
        <div class="admin-item-title">${escapeHtml(n.title)}</div>
        <div class="admin-item-meta"><span>${fmtDate(n.published_at)}</span>${n.author?`<span>· ${escapeHtml(n.author)}</span>`:''}</div>
      </div>
      <div class="admin-item-actions">
        <a class="action-btn edit" href="../news/?edit=${n.id}" title="Ред."><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></a>
        <button class="action-btn duplicate" onclick="duplicateNews(${Number(n.id)})" title="Копия"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
        <button class="action-btn danger" onclick="deleteNews(${Number(n.id)})" title="В корзину"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
      </div>
    </div>`;
  }).join('');
  renderPagination(total,pages);updateBulkUI();
}

function renderPagination(total,pages){const el=document.getElementById('newsPagination');if(!el)return;if(pages<=1){el.innerHTML='';return;}let html=`<button class="page-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>←</button>`;for(let i=1;i<=pages;i++){if(i===1||i===pages||Math.abs(i-currentPage)<=1)html+=`<button class="page-btn ${i===currentPage?'active':''}" onclick="changePage(${i})">${i}</button>`;else if(Math.abs(i-currentPage)===2)html+=`<span style="color:var(--muted)">…</span>`;}html+=`<button class="page-btn" onclick="changePage(${currentPage+1})" ${currentPage===pages?'disabled':''}>→</button>`;el.innerHTML=html;}
function changePage(p){const pages=Math.ceil(allNewsCache.length/PER_PAGE)||1;if(p<1||p>pages)return;currentPage=p;renderList();}
function toggleSelect(cb){const id=Number(cb.dataset.id);if(cb.checked)selectedIds.add(id);else selectedIds.delete(id);updateBulkUI();}
function updateBulkUI(){const b=document.getElementById('bulkDeleteBtn');const c=document.getElementById('bulkCount');if(!b||!c)return;c.textContent=selectedIds.size;b.disabled=selectedIds.size===0;}
async function bulkDelete(){
  if(!selectedIds.size)return;
  if(!confirm(`Переместить в корзину ${selectedIds.size} новостей?`))return;
  const {error}=await db.from('news').update({deleted_at:new Date().toISOString()}).in('id',[...selectedIds]);
  if(error){toast('Ошибка','error');return;}
  toast(`В корзину: ${selectedIds.size}`);selectedIds.clear();loadList();
}
async function deleteNews(id){
  if(!confirm('Переместить новость в корзину?'))return;
  const {error}=await db.from('news').update({deleted_at:new Date().toISOString()}).eq('id',id);
  if(error){toast('Ошибка','error');return;}
  toast('Перемещено в корзину');loadList();
}
async function duplicateNews(id){
  const {data}=await db.from('news').select('*').eq('id',id).single();
  if(!data){toast('Ошибка','error');return;}
  const newTitle=prompt('Заголовок копии:',data.title+' (копия)');
  if(newTitle===null||!newTitle.trim())return;
  const {error}=await db.from('news').insert({...data,id:undefined,title:newTitle.trim(),is_new:false,is_urgent:false,status:'draft',published_at:null,scheduled_at:null,deleted_at:null});
  if(error){toast('Ошибка: '+error.message,'error');return;}
  toast('Копия создана');loadList();
}
</script>
</body>
</html>
