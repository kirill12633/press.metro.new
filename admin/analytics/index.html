<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Аналитика — Админ-панель</title>
<link rel="icon" href="../../file/main.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap active">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="../../file/main.png" alt="Метро New"><div class="sidebar-brand-text">Метро New<em>Админ-панель</em></div></div>
    <nav class="sidebar-nav">
      <a class="sidebar-item" href="../news/">Создать</a>
      <a class="sidebar-item" href="../published/">Опубликованные</a>
      <a class="sidebar-item" href="../calendar/">Календарь</a>
      <a class="sidebar-item" href="../media/">Медиа</a>
      <a class="sidebar-item" href="../videos/">Видео</a>
      <a class="sidebar-item active" href="../analytics/">Аналитика</a>
      <a class="sidebar-item" href="../trash/">Корзина</a>
      <button class="sidebar-item" onclick="open2FASettings()">2FA</button>
    </nav>
    <div class="sidebar-footer">
      <a class="sidebar-item" href="../../">На сайт</a>
      <button class="sidebar-item sidebar-logout" onclick="logout()">Выйти</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><h1>Аналитика</h1></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div id="adminContent"></div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="twofaModal">
  <div class="modal-preview" style="max-width:480px;">
    <button class="modal-preview-close" onclick="document.getElementById('twofaModal').classList.remove('open')">✕</button>
    <div class="preview-content" id="twofaContent"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="../auth.js"></script>
<script>
(async()=>{
  const session=await requireAuth();
  if(!session)return;
  loadAnalyticsTab();
})();

async function loadAnalyticsTab(){
  document.getElementById('adminContent').innerHTML='<div class="empty"><p>Загрузка...</p></div>';
  const since=new Date(Date.now()-30*864e5).toISOString();
  const {data}=await db.from('news').select('published_at,status').is('deleted_at',null).gte('published_at',since);
  const counts={};
  (data||[]).forEach(n=>{const day=n.published_at?.slice(0,10);if(day)counts[day]=(counts[day]||0)+1;});
  const days=Object.keys(counts).sort();
  const max=Math.max(...Object.values(counts),1);
  const w=600,h=220,barW=w/(days.length||1);
  let bars='';
  days.forEach((d,i)=>{
    const barH=(counts[d]/max)*(h-60);
    bars+=`<rect x="${i*barW+4}" y="${h-40-barH}" width="${barW-10}" height="${barH}" fill="#ef4444" rx="3"><title>${d}: ${counts[d]}</title></rect>`;
    bars+=`<text x="${i*barW+barW/2}" y="${h-20}" text-anchor="middle" font-size="10" fill="#64748b">${d.slice(5)}</text>`;
    bars+=`<text x="${i*barW+barW/2}" y="${h-45-barH}" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">${counts[d]}</text>`;
  });
  const total=(data||[]).length;
  const byStatus={};
  (data||[]).forEach(n=>{byStatus[n.status||'published']=(byStatus[n.status||'published']||0)+1;});
  document.getElementById('adminContent').innerHTML=`
    <div class="form-card">
      <h3 style="margin-bottom:8px;">Публикации за 30 дней</h3>
      <p class="md-help" style="margin-bottom:16px;">Всего: <strong>${total}</strong> · Активных дней: <strong>${days.length}</strong></p>
      <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;margin-top:20px;background:var(--bg-alt);border-radius:var(--radius-sm);padding:10px;">${bars||'<text x="300" y="110" text-anchor="middle" fill="#94a3b8">Нет данных</text>'}</svg>
    </div>
    <div class="stats-grid" style="margin-top:16px;">
      <div class="stat-card"><div class="stat-value">${byStatus.published||0}</div><div class="stat-label">Опубликовано</div></div>
      <div class="stat-card"><div class="stat-value">${byStatus.draft||0}</div><div class="stat-label">Черновиков</div></div>
      <div class="stat-card"><div class="stat-value">${byStatus.scheduled||0}</div><div class="stat-label">Запланировано</div></div>
    </div>`;
}
</script>
</body>
</html>
