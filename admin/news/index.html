<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Создать новость — Админ-панель</title>
<link rel="icon" href="../../file/main.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.css">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="admin-wrap active">
  <aside class="sidebar">
    <div class="sidebar-brand"><img src="../../file/main.png" alt="Метро New"><div class="sidebar-brand-text">Метро New<em>Админ-панель</em></div></div>
    <nav class="sidebar-nav">
      <a class="sidebar-item active" href="../news/">Создать</a>
      <a class="sidebar-item" href="../published/">Опубликованные</a>
      <a class="sidebar-item" href="../calendar/">Календарь</a>
      <a class="sidebar-item" href="../media/">Медиа</a>
      <a class="sidebar-item" href="../videos/">Видео</a>
      <a class="sidebar-item" href="../analytics/">Аналитика</a>
      <a class="sidebar-item" href="../trash/">Корзина</a>
      <button class="sidebar-item" onclick="open2FASettings()">2FA</button>
    </nav>
    <div class="sidebar-footer">
      <a class="sidebar-item" href="../../">На сайт</a>
      <button class="sidebar-item sidebar-logout" onclick="logout()">Выйти</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar"><h1>Создать новость</h1></div>
    <div class="stats-grid" id="statsGrid"></div>
    <div id="adminContent"></div>
  </main>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="twofaModal">
  <div class="modal-preview" style="max-width:480px;">
    <button class="modal-preview-close" onclick="document.getElementById('twofaModal').classList.remove('open')">✕</button>
    <div class="preview-content" id="twofaContent"></div>
  </div>
</div>
<div class="modal-overlay" id="previewModal">
  <div class="modal-preview"><button class="modal-preview-close" onclick="closePreview()">✕</button><div class="preview-content" id="previewContent"></div></div>
</div>
<div class="cropper-modal" id="cropperModal">
  <div class="cropper-wrap">
    <div class="cropper-header"><h3>Обрезать фото</h3><button class="action-btn" onclick="closeCropper()">✕</button></div>
    <div class="cropper-stage"><img id="cropperImage" alt=""></div>
    <div class="cropper-footer">
      <div class="crop-ratio-btns">
        <button class="crop-ratio-btn active" data-ratio="16/9">16:9</button>
        <button class="crop-ratio-btn" data-ratio="1/1">1:1</button>
        <button class="crop-ratio-btn" data-ratio="9/16">9:16</button>
        <button class="crop-ratio-btn" data-ratio="NaN">Свободно</button>
      </div>
      <button class="submit-btn secondary" onclick="closeCropper()" style="max-width:120px;">Отмена</button>
      <button class="submit-btn primary" onclick="confirmCrop()" style="max-width:140px;">Готово</button>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cropperjs@1.6.1/dist/cropper.min.js"></script>
<script src="../auth.js"></script>
<script>
const CATEGORY_NAMES={world:'Мир',tech:'Технологии',culture:'Культура',sport:'Спорт',weather:'Погода',other:'Другое'};
const DRAFT_KEY='metro_admin_news_draft';
let savedBody='',draftSaveTimeout=null,draftIndicatorTimeout=null;
let cropperInstance=null,cropperResolve=null;
let currentUserId=null;

function showLoginStep(){}
function closePreview(){document.getElementById('previewModal').classList.remove('open');document.body.style.overflow='';}

(async()=>{
  const session=await requireAuth();
  if(!session)return;
  currentUserId=session.user.id;
  loadCreateTab();
})();

function newsFormHTML(isEdit){
  return `
    <div class="form-card">
      <div class="form-card-header"><h3>${isEdit?'✏️ Редактировать':'+ Новая новость'}</h3><div class="draft-indicator" id="draftIndicator"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>Сохранено</div></div>
      <form onsubmit="submitNews(event)" id="newsFormEl" oninput="autoSaveNewsDraft()" novalidate>
        <div class="form-section open">
          <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Основное<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="form-section-body"><div class="form-section-body-inner">
            <div class="form-row">
              <div class="form-group" id="fgCat"><label>Рубрика *</label><select id="nCat">${Object.entries(CATEGORY_NAMES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><div class="field-error">Выберите</div></div>
              <div class="form-group" id="fgAuthor"><label>Автор *</label><input id="nAuthor" value="Редакция Метро New"><div class="field-error">Укажите автора</div></div>
            </div>
            <div class="form-group" id="fgTitle"><label>Заголовок *</label><input id="nTitle" maxlength="100" required oninput="updateCharCounter('nTitle','nTitleCounter',100)"><div class="char-counter" id="nTitleCounter">0 / 100</div><div class="field-error">Обязательно</div></div>
            <div class="form-group" id="fgExcerpt"><label>Краткое описание *</label><textarea id="nExcerpt" rows="2" maxlength="300" oninput="updateCharCounter('nExcerpt','nExcerptCounter',300)"></textarea><div class="char-counter" id="nExcerptCounter">0 / 300</div><div class="field-error">10–300 символов</div></div>
          </div></div>
        </div>
        <div class="form-section">
          <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Медиа<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="form-section-body"><div class="form-section-body-inner">
            <div class="form-row">
              <div class="form-group" id="fgCover"><label>Обложка *</label><div class="image-upload"><label class="upload-btn" for="nCover">Файл</label><input type="file" id="nCover" accept="image/*" onchange="previewImage(this,'nCoverPreview')"><div class="upload-preview" id="nCoverPreview">Нет фото</div></div><div class="field-error">Загрузите</div></div>
              <div class="form-group"><label>Фото автора</label><div class="image-upload"><label class="upload-btn" for="nAvatar">Файл</label><input type="file" id="nAvatar" accept="image/*" onchange="previewImage(this,'nAvatarPreview')"><div class="upload-preview" id="nAvatarPreview">Нет фото</div></div></div>
            </div>
            <div class="form-group"><label>Автор фото (подпись)</label><input id="nPhotoAuthor" placeholder="Иван Петров / Reuters"><p class="md-help">Появится как «Фото: Иван Петров»</p></div>
          </div></div>
        </div>
        <div class="form-section open">
          <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Текст (Markdown)<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="form-section-body"><div class="form-section-body-inner">
            <div class="form-group" id="fgBody">
              <div class="md-tabs"><button type="button" class="md-tab active" onclick="mdTab(this,'edit')">Редактор</button><button type="button" class="md-tab" onclick="mdTab(this,'preview')">Предпросмотр</button></div>
              <textarea id="nBody" rows="12" style="font-family:monospace;font-size:14px;" placeholder="# Заголовок&#10;&#10;Текст..."></textarea>
              <div id="nBodyPreview" style="display:none;background:var(--bg);padding:20px;margin-top:12px;border-radius:var(--radius-sm);border:1.5px solid var(--line);min-height:200px;"></div>
              <div class="field-error">Мин. 50 символов</div>
            </div>
          </div></div>
        </div>
        <div class="form-section">
          <button type="button" class="form-section-toggle" onclick="this.closest('.form-section').classList.toggle('open')">Публикация<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="form-section-body"><div class="form-section-body-inner">
            <div class="form-group"><label for="nScheduledAt">Дата публикации</label><input type="datetime-local" id="nScheduledAt"><p class="md-help">Пусто — сразу. Будущее — отложенная.</p></div>
            <div class="checkbox-row"><label class="checkbox-label"><input type="checkbox" id="nNew"> NEW</label><label class="checkbox-label"><input type="checkbox" id="nUrgent"> 🔴 Срочная</label><label class="checkbox-label"><input type="checkbox" id="nDraft"> 💾 Черновик</label></div>
            <div class="checkbox-row"><label class="checkbox-label publish-social"><input type="checkbox" id="nPublishSocial" checked> 📢 Опубликовать в Telegram и Discord</label></div>
          </div></div>
        </div>
        <div class="form-actions">
          <button type="submit" class="submit-btn primary" id="submitBtnEl">Опубликовать</button>
          <button type="button" class="submit-btn secondary" onclick="submitWithSchedule()">⏰ Опубликовать позже</button>
          <button type="button" class="submit-btn secondary" onclick="previewNews()">Предпросмотр</button>
          <button type="button" class="submit-btn secondary" onclick="clearFormAndDraft()">Очистить</button>
        </div>
      </form>
    </div>`;
}

function loadCreateTab(){
  document.getElementById('adminContent').innerHTML=`<div style="max-width:820px;margin:0 auto;">${newsFormHTML(false)}</div>`;
  setTimeout(()=>{loadNewsDraft();updateCardPreview();},100);
}

function validateField(fgId,condition){const fg=document.getElementById(fgId);if(!fg)return true;if(condition){fg.classList.remove('has-error');return true;}fg.classList.add('has-error');return false;}
function validateForm(){let ok=true;if(!validateField('fgCat',!!document.getElementById('nCat')?.value))ok=false;if(!validateField('fgAuthor',document.getElementById('nAuthor')?.value.trim().length>=2))ok=false;if(!validateField('fgTitle',document.getElementById('nTitle')?.value.trim().length>=2))ok=false;if(!validateField('fgExcerpt',document.getElementById('nExcerpt')?.value.trim().length>=10))ok=false;if(!validateField('fgCover',!!document.getElementById('nCoverPreview')?.dataset.url||document.getElementById('nCover')?.files.length>0))ok=false;if(!validateField('fgBody',document.getElementById('nBody')?.value.trim().length>=50))ok=false;return ok;}
function updateCharCounter(inId,cntId,max){const inp=document.getElementById(inId),el=document.getElementById(cntId);if(!inp||!el)return;const len=inp.value.length;el.textContent=`${len} / ${max}`;el.classList.remove('warning','danger');if(len>max*0.9)el.classList.add('danger');else if(len>max*0.75)el.classList.add('warning');}
function saveDraftNow(){const titleEl=document.getElementById('nTitle');if(!titleEl)return;const draft={cat:document.getElementById('nCat')?.value,title:titleEl.value,excerpt:document.getElementById('nExcerpt')?.value,author:document.getElementById('nAuthor')?.value,body:document.getElementById('nBody')?.value,photoAuthor:document.getElementById('nPhotoAuthor')?.value};if(!draft.title&&!draft.body)return;try{localStorage.setItem(DRAFT_KEY,JSON.stringify(draft));const ind=document.getElementById('draftIndicator');if(ind){ind.classList.add('active');clearTimeout(draftIndicatorTimeout);draftIndicatorTimeout=setTimeout(()=>ind.classList.remove('active'),2000);}}catch(e){}}
function autoSaveNewsDraft(){clearTimeout(draftSaveTimeout);draftSaveTimeout=setTimeout(saveDraftNow,500);}
function loadNewsDraft(){try{const raw=localStorage.getItem(DRAFT_KEY);if(!raw)return;const d=JSON.parse(raw);if(!d||(!d.title&&!d.body))return;if(document.getElementById('nCat'))document.getElementById('nCat').value=d.cat||'other';if(document.getElementById('nTitle'))document.getElementById('nTitle').value=d.title||'';if(document.getElementById('nExcerpt'))document.getElementById('nExcerpt').value=d.excerpt||'';if(document.getElementById('nAuthor'))document.getElementById('nAuthor').value=d.author||'Редакция Метро New';if(document.getElementById('nBody'))document.getElementById('nBody').value=d.body||'';if(document.getElementById('nPhotoAuthor'))document.getElementById('nPhotoAuthor').value=d.photoAuthor||'';toast('Черновик восстановлен');}catch(e){}}
function clearNewsDraft(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
function clearFormAndDraft(){if(!confirm('Очистить форму и черновик?'))return;document.getElementById('newsFormEl')?.reset();['nCoverPreview','nAvatarPreview'].forEach(id=>{const el=document.getElementById(id);if(el){el.innerHTML='Нет фото';delete el.dataset.url;}});clearNewsDraft();toast('Форма очищена');}

function mdTab(btn,mode){document.querySelectorAll('.md-tab').forEach(b=>b.classList.remove('active'));btn.classList.add('active');const ta=document.getElementById('nBody');const prev=document.getElementById('nBodyPreview');if(!ta)return;if(mode==='preview'){savedBody=ta.value;ta.style.display='none';prev.style.display='block';prev.innerHTML=window.DOMPurify.sanitize(window.marked.parse(ta.value||'',{breaks:true,gfm:true}));}else{ta.style.display='block';prev.style.display='none';if(savedBody)ta.value=savedBody;}}

function previewNews(){const title=document.getElementById('nTitle').value||'Без заголовка';const excerpt=document.getElementById('nExcerpt').value;const body=document.getElementById('nBody').value;const cat=CATEGORY_NAMES[document.getElementById('nCat').value]||'Другое';const author=document.getElementById('nAuthor').value;const cover=document.getElementById('nCoverPreview').dataset.url;document.getElementById('previewContent').innerHTML=`<div class="preview-meta"><span class="preview-cat">${cat}</span><span>${new Date().toLocaleDateString('ru-RU')}</span></div><h1>${title}</h1>${cover?`<div class="preview-cover"><img src="${cover}"></div>`:''}${excerpt?`<p style="font-size:16px;color:var(--muted);margin-bottom:24px;">${excerpt}</p>`:''}<div class="preview-body">${window.DOMPurify.sanitize(window.marked.parse(body||'',{breaks:true,gfm:true}))}</div>`;document.getElementById('previewModal').classList.add('open');}

async function submitNews(e){
  e.preventDefault();
  if(!validateForm()){toast('Заполните все поля','error');return;}
  const btn=e.target.querySelector('button[type=submit]');const orig=btn.innerHTML;btn.disabled=true;btn.innerHTML='<div class="spinner"></div> Сохранение...';
  try{
    let coverUrl=document.getElementById('nCoverPreview').dataset.url||null;
    let avatarUrl=document.getElementById('nAvatarPreview').dataset.url||null;
    const cf=document.getElementById('nCover').files[0];if(cf)coverUrl=await uploadImage(cf);
    const af=document.getElementById('nAvatar').files[0];if(af)avatarUrl=await uploadImage(af);
    const scheduledAt=document.getElementById('nScheduledAt').value;
    const isDraft=document.getElementById('nDraft').checked;
    let status='published';if(isDraft)status='draft';else if(scheduledAt&&new Date(scheduledAt)>new Date())status='scheduled';
    const payload={category_slug:document.getElementById('nCat').value,title:document.getElementById('nTitle').value,excerpt:document.getElementById('nExcerpt').value,body:document.getElementById('nBody').value,cover_image:coverUrl,author:document.getElementById('nAuthor').value||'Редакция Метро New',author_avatar:avatarUrl,photo_author:document.getElementById('nPhotoAuthor')?.value.trim()||null,is_new:document.getElementById('nNew').checked,is_urgent:document.getElementById('nUrgent').checked,status:status,scheduled_at:scheduledAt||null,user_id:currentUserId};
    const {data:inserted,error}=await db.from('news').insert(payload).select('id').single();
    if(error)throw error;
    const publishSocial=document.getElementById('nPublishSocial')?.checked;
    if(status==='published'&&publishSocial&&inserted?.id){
      try{
        const res=await fetch(`${SUPABASE_URL}/functions/v1/publish-news`,{method:'POST',headers:{'Authorization':`Bearer ${SUPABASE_ANON_KEY}`,'apikey':SUPABASE_ANON_KEY,'Content-Type':'application/json'},body:JSON.stringify({newsId:inserted.id})});
        const result=await res.json();
        if(result.telegram==='ok'&&result.discord==='ok')toast('✅ Опубликовано в ТГ и ДС');
        else toast(`ТГ: ${result.telegram}, ДС: ${result.discord}`,'error');
      }catch(e){toast('Сохранено, но соцсети не ответили','error');}
    }else{toast(status==='draft'?'Черновик сохранён':status==='scheduled'?'Запланировано':'Опубликовано');}
    clearNewsDraft();document.getElementById('newsFormEl').reset();
    ['nCoverPreview','nAvatarPreview'].forEach(id=>{const el=document.getElementById(id);if(el){el.innerHTML='Нет фото';delete el.dataset.url;}});
  }catch(err){toast('Ошибка: '+(err.message||''),'error');}
  finally{btn.disabled=false;btn.innerHTML=orig;}
}

function submitWithSchedule(){const inp=document.getElementById('nScheduledAt');if(!inp.value){toast('Укажите дату','error');return;}if(new Date(inp.value)<=new Date()){toast('Дата должна быть в будущем','error');return;}document.getElementById('newsFormEl').requestSubmit();}

function previewImage(input,previewId){
  const file=input.files[0];
  if(!file){const box=document.getElementById(previewId);box.innerHTML='Нет фото';delete box.dataset.url;return;}
  openCropper(file,(blob)=>{if(!blob){input.value='';return;}const url=URL.createObjectURL(blob);const box=document.getElementById(previewId);box.innerHTML=`<img src="${url}" alt="">`;box._pendingBlob=blob;});
}
function openCropper(file,cb){
  const reader=new FileReader();
  reader.onload=(e)=>{
    document.getElementById('cropperImage').src=e.target.result;
    document.getElementById('cropperModal').classList.add('open');
    cropperResolve=cb;
    if(cropperInstance){cropperInstance.destroy();cropperInstance=null;}
    setTimeout(()=>{cropperInstance=new Cropper(document.getElementById('cropperImage'),{aspectRatio:16/9,viewMode:1,autoCropArea:1,background:false});},100);
  };
  reader.readAsDataURL(file);
  document.querySelectorAll('.crop-ratio-btn').forEach(btn=>{btn.onclick=()=>{document.querySelectorAll('.crop-ratio-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');if(cropperInstance){const ratio=btn.dataset.ratio==='NaN'?NaN:eval(btn.dataset.ratio);cropperInstance.setAspectRatio(ratio);}};});
}
function confirmCrop(){
  if(!cropperInstance){closeCropper();return;}
  cropperInstance.getCroppedCanvas({maxWidth:1920,maxHeight:1920,imageSmoothingQuality:'high'}).toBlob((blob)=>{if(cropperResolve)cropperResolve(blob);closeCropper();},'image/jpeg',0.9);
}
function closeCropper(){document.getElementById('cropperModal').classList.remove('open');if(cropperInstance){cropperInstance.destroy();cropperInstance=null;}cropperResolve=null;}
async function uploadImage(file){
  const ext=file.name.split('.').pop().toLowerCase();
  const name=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const {error}=await db.storage.from('news-images').upload(name,file);
  if(error)throw error;
  const {data}=db.storage.from('news-images').getPublicUrl(name);
  return data.publicUrl;
}
</script>
</body>
</html>
